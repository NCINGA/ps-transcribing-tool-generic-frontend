server {
    listen 5173;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # React Router uses client-side routing -- any path not matching a
        # real static file should fall back to index.html so routes like
        # /files or /transcript/:jobId work on a hard refresh/direct link.
        try_files $uri $uri/ /index.html;
    }
}