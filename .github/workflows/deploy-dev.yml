name: Build and Push frontend image (dev)

# TODO (GCP owner): the automatic trigger is switched off so nothing runs until
# the values below are filled in. To build on every push to main, replace
# `workflow_dispatch:` with:
#   push:
#     branches: [ main ]
on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      PROJECT_ID: "data-science-projects-393906"
      REGION: "asia-southeast1"
      REPOSITORY: "ps-transcription-images-general"
      SERVICE_NAME: "ps-transcription-frontend-general"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          # TODO: create this secret in the new GitHub repo (service-account key),
          # or switch to Workload Identity Federation.
          credentials_json: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Authorize Docker push
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and push Docker image
        run: |
          IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}
          docker build -t $IMAGE:latest .
          docker push $IMAGE:latest
