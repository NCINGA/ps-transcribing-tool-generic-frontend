name: Build and Deploy frontend (dev)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend-dev
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    env:
      PROJECT_ID: "data-science-projects-393906"
      REGION: "asia-southeast1"
      REPOSITORY: "ps-transcription-images-general"
      SERVICE_NAME: "ps-transcription-frontend-general"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Authorize Docker push
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push Docker image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE_NAME}"
          docker build --platform linux/amd64 -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" .
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_SHA")
          echo "image=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloud Run
        shell: bash
        env:
          DEPLOY_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          SUFFIX="ci-${GITHUB_SHA:0:7}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          REVISION="${SERVICE_NAME}-$SUFFIX"
          gcloud run services update "$SERVICE_NAME" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$DEPLOY_IMAGE" \
            --revision-suffix "$SUFFIX" \
            --no-traffic \
            --quiet
          gcloud run services update-traffic "$SERVICE_NAME" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --to-revisions "$REVISION=100" \
            --quiet
